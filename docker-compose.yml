version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: archaeologist_db
    restart: always
    environment:
      POSTGRES_USER: archaeologist
      POSTGRES_PASSWORD: archaeologist_secret
      POSTGRES_DB: code_archaeologist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archaeologist -d code_archaeologist"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archaeologist_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=archaeologist
      - POSTGRES_PASSWORD=archaeologist_secret
      - POSTGRES_DB=code_archaeologist
      - DATABASE_URL=postgresql+asyncpg://archaeologist:archaeologist_secret@db:5432/code_archaeologist
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
